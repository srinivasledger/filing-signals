name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        # No network access is needed: every test runs off saved fixtures.
        run: python -m pytest tests/ -q
      - name: Check the site renders
        run: python -m pipeline.render
