name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - name: Check the site renders
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          REPO_URL: ${{ vars.REPO_URL }}
        run: python -m pipeline.render
      - name: Verify rendered site in browser
        uses: ./.github/actions/verify-site
        with:
          phase: ci
