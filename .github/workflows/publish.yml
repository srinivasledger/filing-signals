name: Publish site

# The daily scan is what normally deploys the site, but it only runs on a
# schedule. Without this, a fix to a template or a page sits unpublished until
# the next scan -- a new page could be committed, tested, and still 404 on the
# live site for a day.
#
# This rebuilds from the data already committed and deploys. It never contacts
# SEC, so it adds no load there and cannot be affected by a block.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pipeline/**"
      - "tests/browser/**"
      - "package*.json"
      - "requirements*.txt"
      - ".github/actions/verify-site/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

# Shared with the daily scan: two Pages deployments must never run at once,
# and a push landing mid-scan should queue rather than race it.
concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render the site from committed data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          REPO_URL: ${{ vars.REPO_URL }}
        run: python -m pipeline.render

      # A broken render must never replace a working Pages deployment.
      - name: Verify rendered site before deployment
        uses: ./.github/actions/verify-site
        with:
          phase: publish-predeploy

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify deployed site
        id: verify_live
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          VERIFY_DEPLOYED_BUILD: '1'
          CHECK_PHASE: publish-live
        run: |
          test -n "$BASE_URL"
          for engine in chromium firefox webkit; do
            BROWSER_ENGINE="$engine" node tests/browser/check-site.cjs
          done
      - name: Save live browser failure evidence
        if: failure() && steps.verify_live.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-publish-live-${{ github.run_attempt }}
          path: artifacts/browser-check
          if-no-files-found: ignore
