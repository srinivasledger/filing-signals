name: Daily filing scan

on:
  schedule:
    # 03:30 UTC Tue-Sat = 23:30 ET Mon-Fri. EDGAR publishes the day's index at
    # about 22:00 ET, an hour and a half before this, so the run finds it.
    #
    # The old 23:30 UTC (19:30 ET) fired two and a half hours BEFORE
    # publication. Every run asked for an index that did not exist, recorded
    # nothing for that day, and left it to the next run - so the site trailed
    # current filings by a day permanently, and the backfill logic was
    # covering for a scheduling error rather than for outages.
    #
    # Runs Tue-Sat because the evening of a weekday falls on the next UTC day.
    # GitHub may still delay a scheduled run; that remains harmless, because a
    # missed day is picked up by the next one.
    - cron: "30 3 * * 2-6"
  workflow_dispatch:
    inputs:
      days:
        description: "Reprocess the last N business days (leave blank to catch up)"
        required: false

# Never let two runs write state at once. Shared with "Publish site" so the
# two workflows cannot deploy Pages simultaneously.
concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: write      # commit the day's events
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # The analysis layer is optional. Install its SDK only when a key
          # exists, so the default path stays dependency-light and free.
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            pip install anthropic
          fi

      - name: Run pipeline
        env:
          # Required. SEC returns 403 to requests that do not identify a
          # contact, so this must be a real "Name email@domain" string.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # Optional. Absent => deterministic-only, zero cost.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # With HISTORY_FROM set, each run also fills a chunk of history
          # backwards until it reaches that date, then stops on its own.
          HISTORY_FROM: ${{ vars.HISTORY_FROM }}
          HISTORY_CHUNK: ${{ vars.HISTORY_CHUNK }}
          SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          REPO_URL: ${{ vars.REPO_URL }}
        run: |
          if [ -n "${{ inputs.days }}" ]; then
            python -m pipeline.run --days "${{ inputs.days }}"
          else
            python -m pipeline.run
          fi

      - name: Commit new events
        run: |
          git config user.name  "filing-signals-bot"
          git config user.email "filing-signals-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new events today."
            exit 0
          fi
          git commit -m "data: filings through $(date -u +%Y-%m-%d)"
          # Another commit landing between checkout and push is a race, not a
          # defect. Rebase onto it and retry before treating it as a failure.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          echo "::error::could not push the day's events after three attempts"
          exit 1

      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          echo "### Filing scan" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          p = pathlib.Path("data/state/pipeline.json")
          if not p.exists():
              print("No state recorded."); raise SystemExit
          s = json.loads(p.read_text())
          print(f"Processed through **{s.get('last_processed')}**\n")
          print("| Day | Index rows | Candidates | Events |")
          print("|---|---|---|---|")
          for r in s.get("runs", [])[-5:]:
              print(f"| {r.get('date')} | {r.get('index_rows')} | "
                    f"{r.get('candidates')} | {r.get('events_written', 0)} |")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
